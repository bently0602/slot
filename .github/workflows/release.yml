name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: card tree
    runs-on: ubuntu-24.04-arm
    env:
      DOCKER_DEFAULT_PLATFORM: linux/arm64
      # Keep device binaries compatible with BaseOS even on the Ubuntu runner.
      SLOT_DEVICE_DOCKER: '1'
    outputs:
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - uses: actions/checkout@v7

      - name: Install zip and Task, and check Docker
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip
          curl -fsSL https://taskfile.dev/install.sh | sudo sh -s -- -b /usr/local/bin
          docker info

      - name: Build the tree
        # Docker writes root-owned outputs on Linux; keep assembly under the
        # same user while Task runs on the host with valid bind-mount paths.
        run: sudo --preserve-env=DOCKER_DEFAULT_PLATFORM,SLOT_DEVICE_DOCKER task dist:device OUT="slot-${GITHUB_REF_NAME}"

      - name: Check what is about to ship
        run: |
          set -eu
          out="slot-${GITHUB_REF_NAME}"
          file "$out/System/slot" | grep -q aarch64
          file "$out/System/mgba_libretro.so" | grep -q aarch64
          file "$out/System/gpsp_libretro.so" | grep -q aarch64
          file "$out/System/snes9x_libretro.so" | grep -q aarch64
          file "$out/System/device-info/device-info" | grep -q aarch64
          test -x "$out/System/device-info/device-info"
          test -f "$out/System/device-info/lib/libSDL2-2.0.so.0"
          test -f "$out/System/device-info/licenses/device-info-source.tar.gz"
          test -f "$out/System/licenses/snes9x_libretro.so.source.tar.gz"
          test -f "$out/System/licenses/snes9x-LICENSE.txt"
          test -x "$out/System/slot"
          gpsp_src_sha="$(cat vendor/gpsp-src.sha)"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.tar.gz"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.meta"
          for p in cores/gpsp/*.patch; do
            test -f "$out/System/licenses/gpsp-$(basename "$p")"
          done
          mgba_src_commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
          test -f "$out/System/licenses/mgba-${mgba_src_commit}.meta"
          for p in cores/mgba/*.patch; do
            test -f "$out/System/licenses/mgba-$(basename "$p")"
          done

      - name: Package
        id: package
        run: |
          set -eu
          out="slot-${GITHUB_REF_NAME}"
          zip="$out-h700.zip"
          zip -qry "$zip" "$out"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  publish:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.zip }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          set -eu
          cat > notes.md <<NOTES
          Unzip and copy the contents of \`slot-${GITHUB_REF_NAME}/\` onto SD2.

          Emulation by mGBA (MPL-2.0), gpSP (GPL-2.0), PCSX ReARMed (GPL-2.0-or-later) and Snes9x (non-commercial). Licenses and corresponding source are in \`System/licenses/\`.
          NOTES
          gh release create "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
